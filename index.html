<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f41"><title>SkyLine madness · Skyline Gaming</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">  <script type="module" crossorigin src="./index-BUBqyaF3.js"></script>
  <link rel="stylesheet" crossorigin href="./index-CD3Aohzu.css">
</head><body><div id="app">
<div id="scene" aria-label="Animated construction site"></div>
<header><img class="logo" src="skyline-madness-logo.webp" alt="SkyLine madness"><div class="header-right"><div class="wallet"><span>DEMO BALANCE</span><strong id="balance">$10,000.00</strong></div><button id="sound" class="icon-button" aria-label="Toggle sound" aria-pressed="false">♫</button><button id="help" class="icon-button" aria-label="How to play">?</button><button id="menu" class="icon-button" aria-label="Open menu">☰</button></div></header>
<aside id="ladder" aria-label="Multiplier ladder"></aside>
<div id="round-info"><span id="mode-label">REACH NEW HEIGHTS</span><strong id="coefficient">1.00<span>×</span></strong><div id="floor-label">YOUR NEXT BIG THING STARTS HERE</div><div id="lives" hidden></div></div>
<div id="message" role="status" aria-live="polite"></div>
<div id="city-info" hidden></div>
<div class="bottom-ui"><div id="hint">DROP A BLOCK. BUILD YOUR FORTUNE.</div><section class="console" aria-label="Game controls">
<button id="bonus" class="bonus-button"><span class="bonus-icon">★</span><span>BUY<br><b>BONUS</b></span></button>
<div class="bet-section"><label for="bet">BET AMOUNT</label><div class="bet-control"><button id="minus" aria-label="Decrease bet">−</button><div><span>$</span><input id="bet" type="number" min="0.12" max="100" step="0.01" value="1.00" aria-label="Bet amount"></div><button id="plus" aria-label="Increase bet">+</button></div><div class="presets"><button data-bet="0.5">½</button><button data-bet="2">2×</button><button data-value="5">$5</button><button data-value="10">$10</button></div></div>
<div class="difficulty-section"><label>DIFFICULTY</label><button id="difficulty-picker" aria-label="Change difficulty">EASY</button><div class="difficulty" role="group" aria-label="Difficulty"><button data-level="EASY" class="selected">EASY</button><button data-level="MEDIUM">MEDIUM</button><button data-level="HARD">HARD</button></div><span id="risk-description">40 floors · Steady climb</span></div>
<div class="actions"><button id="cashout" disabled><span>CASH OUT</span><strong id="cash-value">$0.00</strong></button><button id="play"><span id="play-label">PLAY</span><span class="play-symbol">▶</span></button></div><button id="auto" class="auto-button" aria-label="Configure autoplay">↻</button>
</section><footer><span class="skyline">SKYLINE <b>GAMING</b></span><span class="demo-label">DEMO MODE</span><button id="history">ROUND HISTORY</button><button id="auto-mobile" aria-label="Autoplay">AUTO</button><span id="connection">LOCAL DEMO</span><span id="clock"></span></footer></div>
<div id="loading"><img src="skyline-madness-logo.webp" alt="SkyLine madness"><div class="load-track"><div id="load-progress"></div></div><span id="load-label">Preparing the construction site…</span></div>
<dialog id="modal"><button id="close-modal" aria-label="Close dialog">×</button><div id="modal-content"></div></dialog>
<div id="dev-panel" hidden><b>MOCK RGS</b><label>Next step <select id="mock-outcome"><option value="random">Random</option><option value="true">true · Success</option><option value="false">false · Fail</option></select></label><span>Outcome is independent of crane position.</span></div>
</div></body></html>
